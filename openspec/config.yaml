schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
rules:
  tasks:
    - >-
      A change with UI or cross-process behaviour (the window, the tray, the Dock, launch at login,
      another process, an external system) includes tasks to add or update its UI-flow scenarios
      (ui/flows) and end-to-end scenarios (e2e/specs), each tagged with its catalog case ID.
    - >-
      Every change that alters behaviour includes a task to add or update its cases in
      documentation/tests/catalog.md, the case files under documentation/tests/cases/, and the
      generated inventory (npm run test:catalog -- --write).
    - >-
      Every change that alters behaviour ends with a task to run npm run test:regression and see it
      green before the change is called done. See documentation/tests/README.md.

# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
