[package]
name = "app"
version = "0.1.0"
description = "Desktop app that syncs Jira issues into the QA Portal"
authors = ["Artsem Sazonau"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thiserror = "2"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"

# Desktop-only plugins. Gated so a future mobile target still compiles.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Test build only (`--features e2e`): serves WebDriver from inside the app. Pinned to match the
# `@wdio/tauri-service` version in e2e/package.json.
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[features]
# The test build: WebDriver access and the `e2e_*` IPC commands. Off by default, so neither a release
# build nor `tauri dev` contains any of it. Built by `npm run build:e2e`.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3"
# Property tests over `policy::decide`. `std` only: no fork/timeout machinery needed.
proptest = { version = "1", default-features = false, features = ["std"] }
